    <!--
      Before first paint: apply a saved light theme (dark is the default), preload the
      matching portrait, and turn on entrance animations unless motion is reduced.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var light = false;
        try {
          light = localStorage.getItem('theme') === 'light';
        } catch (e) {}
        if (light) {
          root.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F6F8');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
        }
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.type = 'image/webp';
        preload.href = light ? '/images/portrait-light.webp' : '/images/portfolio-photo.webp';
        preload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(preload);
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion-ok');
      })();
    </script>
